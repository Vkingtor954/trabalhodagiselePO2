function CMAEngine(D){
const nE=6,nR=D.n.filter(x=>x[2]=='R').length,nZ=36,nA=D.a.length;

const S=0,T=67,NN=68;
const arcs=D.a.map(a=>[id[a[0]],id[a[1]]]);

const EPS=1e-9;
function solve(s){
 const to=[],cp=[],adj=Array.from({length:NN},()=>[]),orig=[];
 function add(u,v,c){adj[u].push(to.length);to.push(v);cp.push(c);adj[v].push(to.length);to.push(u);cp.push(0);orig.push([u,v,c]);}
 for(let a=0;a<nA;a++)add(arcs[a][0],arcs[a][1],s.cap[a]);
 for(let e=0;e<nE;e++)add(S,eIdx[e],s.eta[e]);
 for(let z=0;z<nZ;z++)add(zIdx[z],T,s.dem[z]);
 let v=0,lvl,it;
 function bfs(){lvl=new Int32Array(NN).fill(-1);lvl[S]=0;const q=[S];for(let h=0;h<q.length;h++){const u=q[h];for(const e of adj[u])if(cp[e]>EPS&&lvl[to[e]]<0){lvl[to[e]]=lvl[u]+1;q.push(to[e]);}}return lvl[T]>=0;}
 function dfs(u,f){if(u==T)return f;for(;it[u]<adj[u].length;it[u]++){const e=adj[u][it[u]],w=to[e];if(cp[e]>EPS&&lvl[w]==lvl[u]+1){const d=dfs(w,Math.min(f,cp[e]));if(d>EPS){cp[e]-=d;cp[e^1]+=d;return d;}}}return 0;}
 while(bfs()){it=new Int32Array(NN);let f;while((f=dfs(S,Infinity))>EPS)v+=f;}
 const fl=orig.map((o,k)=>o[2]-cp[2*k]);
 // corte
 const seen=new Uint8Array(NN);seen[S]=1;const q=[S];
 for(let h=0;h<q.length;h++){const u=q[h];for(const e of adj[u])if(cp[e]>EPS&&!seen[to[e]]){seen[to[e]]=1;q.push(to[e]);}}

function n1(s){const b=solve(s),res=[];for(let a=0;a<nA;a++){const t=clone(s);t.cap[a]=0;const r=solve(t);res.push({a,loss:b.v-r.v,v:r.v,r});}return{b,res};}
function expand(s0,F=1.3,MAX=20){const s=clone(s0),D0=sum(s.dem),log=[],ini=s0.cap.slice();let conv=false,first=null;
